// Fabric build of Kegare. One shared source tree (src/main/java) compiled against one Minecraft build per run:
//   ./gradlew -Ptarget=1.21.11 compileJava     (default)      Java 21, Mojang-mapped, remapped jar
//   ./gradlew -Ptarget=26.2 compileJava                        Java 25, unobfuscated
//   ./gradlew -Ptarget=26.3 compileJava                        Java 25, unobfuscated
// Version-specific Minecraft/Fabric spellings live in targets/<target>/java (same package, overlays the shared tree).
// Gradle itself must run on JDK 25 (Loom 1.19), whichever target you compile.
// target_props is read before the plugin is applied, so the right Loom plugin (remapping or not) is chosen.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}
def targetName = (findProperty('target') ?: '1.21.11').toString()
def targetProps = new Properties()
file("targets/${targetName}.properties").withInputStream { targetProps.load(it) }
ext.tp = targetProps
def remap = tp.getProperty('remap') == 'true'
// The overlay directory: a target can borrow another's (26.2 uses 26.3's) with `overlay=` in its properties.
def overlayName = tp.getProperty('overlay') ?: targetName

apply plugin: remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
apply plugin: 'java-library'

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${tp.getProperty('minecraft_version')}" }

repositories {
    mavenCentral()
    maven { name = 'RedlanceMinecraft'; url = 'https://repo.redlance.org/public'; content { includeGroupByRegex 'com\\.zigythebird(\\..*)?'; includeGroup 'org.redlance.mochafloats'; includeGroup 'org.redlance.common-utils' } }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    // Cardinal Components (Trinkets' own requirement; Loom does not load the copies nested in the Trinkets jar in dev runs and tests).
    maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases'; content { includeGroup 'org.ladysnake.cardinal-components-api' } }
    // Forge Config API Port (Fuzs): ModConfigSpec and the config screen, as in NeoForge.
    maven { name = 'Fuzs'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'; content { includeGroup 'fuzs.forgeconfigapiport' } }
}

// Photon FX (mod ids photonfx + ldlib2lite): our own runtime port of Photon, a separate checkout (photon-fabric) with its own licences.
// It plays assets/kegare/fx (DESIGN 3.13). Only a target whose properties name `photonfx_version` (all three today) compiles against it and
// nests it. It is never downloaded: it comes from that checkout's local maven output, made there with
//   ./gradlew -Ptarget=1.21.11 publishAllPublicationsToLocalRepository      (writes <photon-fabric>/build/maven)
// looked for in -PphotonfxMaven=<dir>, then ../photon-fabric/build/maven, then ../photon/build/maven.
def photonfxVersion = tp.getProperty('photonfx_version')
def photonfxMods = photonfxVersion == null ? [] : ['photonfx', 'ldlib2lite'].collect { "com.cnethuka.${it}:${it}-${tp.getProperty('minecraft_version')}:${photonfxVersion}" }
if (photonfxVersion != null) {
    def looked = [findProperty('photonfxMaven'), '../photon-fabric/build/maven', '../photon/build/maven'].findAll { it != null }.collect { file(it) }
    def photonfxRepo = looked.find { new File(it, 'com/cnethuka/photonfx').isDirectory() }
    if (photonfxRepo == null) throw new GradleException("Photon FX ${photonfxVersion} is not built. In the photon-fabric checkout run " +
            "`./gradlew -Ptarget=${targetName} publishAllPublicationsToLocalRepository`, or pass -PphotonfxMaven=<its build/maven>. Looked in: ${looked.join(', ')}")
    repositories {
        maven { name = 'PhotonFxLocal'; url = photonfxRepo.toURI(); content { includeGroup 'com.cnethuka.photonfx'; includeGroup 'com.cnethuka.ldlib2lite' } }
    }
}

// Targets with a `renames` file (26.x) compile a renamed copy of the shared sources: Mojang renamed many classes and methods without changing
// them, and those spellings are swapped line by line (so compiler line numbers still match src/). See targets/26.renames.
def renamesName = tp.getProperty('renames')
def portedDir = { String set -> renamesName == null ? file("src/${set}/java") : layout.buildDirectory.dir("ported/${set}/java").get().asFile }
if (renamesName != null) {
    def renamesFile = file("targets/${renamesName}")
    def rules = renamesFile.readLines('UTF-8').findAll { it && !it.startsWith('#') }.collect {
        def parts = it.split('\t', 2)
        [java.util.regex.Pattern.compile(parts[0]), parts.length > 1 ? parts[1] : '']
    }
    ['main', 'test'].each { set ->
        def port = tasks.register("port${set.capitalize()}Sources", Sync) {
            from "src/${set}/java"
            into portedDir(set)
            inputs.file renamesFile
            filteringCharset = 'UTF-8'
            filter { String line -> rules.each { line = it[0].matcher(line).replaceAll(it[1]) }; line }
        }
        sourceSets[set].java.srcDirs = [portedDir(set)]
        tasks.named(set == 'main' ? 'compileJava' : 'compileTestJava') { dependsOn port }
    }
}
sourceSets.main {
    java.srcDir "targets/${overlayName}/java"
    // 26.x: the data generators are left out (their Fabric and vanilla base classes changed shape); src/generated is made on 1.21.11.
    if (tp.getProperty('exclude_sources') != null) java.exclude tp.getProperty('exclude_sources').split(',')
    resources {
        srcDir 'src/generated/resources'
        exclude '**/*.bbmodel'
        exclude '.cache/**'
    }
}
// Test-only overlay for the spellings that differ per target (the throwaway server's MinecraftServer subclass, Trinkets in tests).
sourceSets.test.java.srcDir "targets/${overlayName}/testJava"

def mc = tp.getProperty('minecraft_version')
// One access widener source (Mojang names). 1.21.11 is remapped, so it stays "named"; 26.x is unobfuscated, where Mojang names are the "official" namespace.
def awFile = layout.buildDirectory.file('aw/kegare.accesswidener').get().asFile
// Written now (Loom reads it while configuring) and again before the resources are processed, since `clean` deletes it in between.
def writeAw = {
    awFile.parentFile.mkdirs()
    awFile.text = file('targets/kegare.accesswidener').text.replaceFirst('(?m)^accessWidener v2 named', remap ? 'accessWidener v2 named' : 'accessWidener v2 official')
    if (tp.getProperty('aw_extra') != null) awFile.append('\n' + file("targets/${tp.getProperty('aw_extra')}").text) // access only that target needs
}
writeAw()
loom { accessWidenerPath = awFile }
dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (remap) mappings loom.officialMojangMappings()
    def mod = { String n -> remap ? "modImplementation"(n) : "implementation"(n) }
    mod "net.fabricmc:fabric-loader:${loader_version}"
    mod "net.fabricmc.fabric-api:fabric-api:${tp.getProperty('fabric_api_version')}"
    // Player Animation Library (ZigyTheBird): player animations (assets/kegare/player_animations).
    mod "com.zigythebird.playeranim:${tp.getProperty('pal_artifact')}:${tp.getProperty('pal_version')}"
    // Eyewear slot (Six Eyes blindfold): Trinkets replaces Curios, which has no Fabric build.
    // 1.21.11 only for now: the 26.x overlays have no eyewear slot (Trinkets 4.x is a different API), so 26.x neither compiles against it nor loads it.
    if (remap) mod "maven.modrinth:trinkets-updated:${tp.getProperty('trinkets_version')}"
    // Config: Kegare's ModConfigSpec code compiles unchanged against the net.neoforged classes this ships (and NightConfig with it).
    mod "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${tp.getProperty('fcap_version')}"
    // Dev runs, datagen and tests only (not in the jar): Trinkets needs Cardinal Components and Loom skips its nested copies.
    if (remap) {
        modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:7.3.0"
        modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:7.3.0"
    }
    // PostgreSQL JDBC (DESIGN 3.33): bundled inside our jar, only ever opened on a dedicated server with storage on.
    implementation('org.postgresql:postgresql:42.7.4') { exclude group: 'org.checkerframework' }
    include('org.postgresql:postgresql:42.7.4') { exclude group: 'org.checkerframework' }
    // Photon FX, nested as a jar of its own (META-INF/jars) that nests ldlib2lite in turn; the photonfx jar is the only one included.
    // In dev runs and tests ldlib2lite arrives as photonfx's own dependency (Loom does not load nested copies there).
    if (photonfxVersion != null) {
        mod photonfxMods[0]
        include photonfxMods[0]
    }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2' // javax.annotation.Nullable, which the sources use

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher' // also on the compile path: src/test's KnotLauncherInterceptor
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2' // javax.annotation.Nullable, which some tests use as well
    // Starts Fabric's Knot class loader (mixins, mod discovery) around the JUnit run; the throwaway server is src/test's EphemeralTestServerProvider.
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
}

// The licenses travel inside the jar, at its root: LICENSE (MIT) covers the code, LICENSE-ASSETS (All Rights Reserved) the assets.
tasks.named('jar', Jar).configure {
    from('LICENSE')
    from('LICENSE-ASSETS')
}

def javaRelease = Integer.parseInt(tp.getProperty('java_release'))
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}
java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

tasks.named('processResources') {
    from(awFile) // fabric.mod.json names it; Loom reads it from build/aw, the jar needs its own copy
    doFirst { writeAw() }
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                 minecraft_version: mc, java_release: tp.getProperty('java_release')]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
    // The nested Photon FX jars are other people's work under other licences (CC BY-NC-SA 4.0, LGPL 3): our notice goes in the jar's root
    // and each jar's own licence and attribution files, taken out of the very jar that is nested, under META-INF/licenses/<mod id>.
    if (photonfxVersion != null) {
        from('THIRD-PARTY-NOTICES.md')
        photonfxMods.each { String coords ->
            def one = configurations.detachedConfiguration(dependencies.create(coords))
            one.transitive = false
            from({ zipTree(one.singleFile) }) {
                include 'LICENSE*', 'COPYING*', 'NOTICE.md', 'DERIVED.md'
                into "META-INF/licenses/${coords.split(':')[0].tokenize('.').last()}"
            }
        }
    }
    // 26.3 renamed the recipe_unlocked trigger's condition key ("recipe" to "recipes"); the generated files are 1.21.11's.
    def unlockedKey = tp.getProperty('recipe_unlocked_key')
    if (unlockedKey != null) {
        inputs.property('recipeUnlockedKey', unlockedKey)
        filesMatching('data/kegare/advancement/recipes/**/*.json') { filter { String line -> line.replace('"recipe": "', "\"${unlockedKey}\": \"") } }
    }
}

// Data generation (DESIGN 3.10): `./gradlew runData` (alias of Fabric's runDatagen) writes src/generated/resources, client providers
// (language, item models, sounds) included. It is added to the resources by the source set above, so Loom must not add it again.
fabricApi {
    configureDataGeneration {
        client = true
        modId = mod_id
        outputDirectory = file('src/generated/resources')
        addToResources = false
    }
}
tasks.register('runData') {
    group = 'fabric'
    description = 'Generates src/generated/resources (the NeoForge-era name for runDatagen).'
    dependsOn 'runDatagen'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The integration tests run or skip by this: Gradle must not call a run without it up to date with one that had it (DESIGN 3.33).
    inputs.property('kegareTestDatabase', System.getenv('KEGARE_TEST_DB_URL') != null)
    // Every test player keeps a full record of all ~1,470 advancements for the life of the shared test server (measured: 413 players,
    // about 508 MB still in use at the end); a Fabric server with its chunk system needs more room than that.
    maxHeapSize = '3G'
    // The game (Knot, config files, logs) runs from its own directory, not the project root (run/ is git-ignored); tests that read project files
    // resolve them from kegare.projectDir.
    workingDir = file('run/test')
    doFirst { workingDir.mkdirs() }
    systemProperty 'kegare.projectDir', project.projectDir.absolutePath
    // AgentFilesTest reads these; without them as inputs, a change to only them would leave the tests "up to date".
    inputs.files('CLAUDE.md', 'AGENTS.md', 'AGENT.md').withPropertyName('agentFiles').withPathSensitivity(PathSensitivity.RELATIVE)
}

// One jar for every Minecraft version: `./gradlew universalJar` after building each target's jar (build/libs, or -PuniversalFrom=<dir>
// holding kegare-<mc>-<version>.jar for every target in `universal_targets`). The result nests the three as jar-in-jar; each pins its
// Minecraft and Java version and has its own version string (+mc.<version>), so Fabric Loader picks the one made for the running game.
tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Packs the per-version Kegare jars into build/libs/kegare-universal-<version>.jar.'
    def targets = universal_targets.split(',')*.trim()
    def sourceDir = file(findProperty('universalFrom') ?: layout.buildDirectory.dir('libs').get().asFile)
    def inner = targets.collect { new File(sourceDir, "kegare-${it}-${mod_version}.jar") }
    inputs.files(inner)
    inputs.file('universal/fabric.mod.json')
    archiveFileName = "kegare-universal-${mod_version}.jar"
    destinationDirectory = layout.buildDirectory.dir('universal')
    doFirst {
        def missing = inner.findAll { !it.isFile() }
        if (missing) throw new GradleException("universalJar needs every target's jar first; missing: ${missing.join(', ')} " +
                "(build each with ./gradlew -Ptarget=<mc> build -x test, or point -PuniversalFrom at the folder that has them)")
    }
    from(inner) { into 'META-INF/jars' }
    from('LICENSE', 'LICENSE-ASSETS', 'THIRD-PARTY-NOTICES.md')
    from('universal/fabric.mod.json') {
        expand(mod_version: mod_version, mod_license: mod_license, targets: targets.join(', '),
                jars: inner.collect { "    { \"file\": \"META-INF/jars/${it.name}\" }" }.join(',\n'))
    }
}
