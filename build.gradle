// Fabric build of Kegare. One shared source tree (src/main/java) compiled against one Minecraft build per run:
//   ./gradlew -Ptarget=1.21.11 compileJava     (default)      Java 21, Mojang-mapped, remapped jar
//   ./gradlew -Ptarget=26.2 compileJava                        Java 25, unobfuscated
//   ./gradlew -Ptarget=26.3 compileJava                        Java 25, unobfuscated
// Version-specific Minecraft/Fabric spellings live in targets/<target>/java (same package, overlays the shared tree).
// Gradle itself must run on JDK 25 (Loom 1.19), whichever target you compile.
// target_props is read before the plugin is applied, so the right Loom plugin (remapping or not) is chosen.
plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}
def targetName = (findProperty('target') ?: '1.21.11').toString()
def targetProps = new Properties()
file("targets/${targetName}.properties").withInputStream { targetProps.load(it) }
ext.tp = targetProps
def remap = tp.getProperty('remap') == 'true'

apply plugin: remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
apply plugin: 'java-library'

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${tp.getProperty('minecraft_version')}" }

repositories {
    mavenCentral()
    maven { name = 'RedlanceMinecraft'; url = 'https://repo.redlance.org/public'; content { includeGroupByRegex 'com\\.zigythebird(\\..*)?'; includeGroup 'org.redlance.mochafloats'; includeGroup 'org.redlance.common-utils' } }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    // Cardinal Components (Trinkets' own requirement; Loom does not load the copies nested in the Trinkets jar in dev runs and tests).
    maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases'; content { includeGroup 'org.ladysnake.cardinal-components-api' } }
    // Forge Config API Port (Fuzs): ModConfigSpec and the config screen, as in NeoForge.
    maven { name = 'Fuzs'; url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'; content { includeGroup 'fuzs.forgeconfigapiport' } }
}

sourceSets.main {
    java.srcDir "targets/${targetName}/java"
    resources {
        srcDir 'src/generated/resources'
        exclude '**/*.bbmodel'
        exclude '.cache/**'
    }
}
// Test-only overlay for the spellings that differ per target (the throwaway server's MinecraftServer subclass, Trinkets in tests).
sourceSets.test.java.srcDir "targets/${targetName}/testJava"

def mc = tp.getProperty('minecraft_version')
loom { accessWidenerPath = file('src/main/resources/kegare.accesswidener') }
dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (remap) mappings loom.officialMojangMappings()
    def mod = { String n -> remap ? "modImplementation"(n) : "implementation"(n) }
    mod "net.fabricmc:fabric-loader:${loader_version}"
    mod "net.fabricmc.fabric-api:fabric-api:${tp.getProperty('fabric_api_version')}"
    // Player Animation Library (ZigyTheBird): player animations (assets/kegare/player_animations).
    mod "com.zigythebird.playeranim:${tp.getProperty('pal_artifact')}:${tp.getProperty('pal_version')}"
    // Eyewear slot (Six Eyes blindfold): Trinkets replaces Curios, which has no Fabric build.
    mod "maven.modrinth:trinkets-updated:${tp.getProperty('trinkets_version')}"
    // Config: Kegare's ModConfigSpec code compiles unchanged against the net.neoforged classes this ships (and NightConfig with it).
    mod "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${tp.getProperty('fcap_version')}"
    // Dev runs, datagen and tests only (not in the jar): Trinkets needs Cardinal Components and Loom skips its nested copies.
    if (remap) {
        modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-base:7.3.0"
        modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:7.3.0"
    } else {
        runtimeOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:7.3.0"
        runtimeOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:7.3.0"
    }
    // PostgreSQL JDBC (DESIGN 3.33): bundled inside our jar, only ever opened on a dedicated server with storage on.
    implementation('org.postgresql:postgresql:42.7.4') { exclude group: 'org.checkerframework' }
    include('org.postgresql:postgresql:42.7.4') { exclude group: 'org.checkerframework' }

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2' // javax.annotation.Nullable, which the sources use

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher' // also on the compile path: src/test's KnotLauncherInterceptor
    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2' // javax.annotation.Nullable, which some tests use as well
    // Starts Fabric's Knot class loader (mixins, mod discovery) around the JUnit run; the throwaway server is src/test's EphemeralTestServerProvider.
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
}

def javaRelease = Integer.parseInt(tp.getProperty('java_release'))
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
    options.compilerArgs += ['-Xmaxerrs', '100000', '-Xmaxwarns', '0']
}
java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

tasks.named('processResources') {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                 minecraft_version: mc, java_release: tp.getProperty('java_release')]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

// Data generation (DESIGN 3.10): `./gradlew runData` (alias of Fabric's runDatagen) writes src/generated/resources, client providers
// (language, item models, sounds) included. It is added to the resources by the source set above, so Loom must not add it again.
fabricApi {
    configureDataGeneration {
        client = true
        modId = mod_id
        outputDirectory = file('src/generated/resources')
        addToResources = false
    }
}
tasks.register('runData') {
    group = 'fabric'
    description = 'Generates src/generated/resources (the NeoForge-era name for runDatagen).'
    dependsOn 'runDatagen'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The integration tests run or skip by this: Gradle must not call a run without it up to date with one that had it (DESIGN 3.33).
    inputs.property('kegareTestDatabase', System.getenv('KEGARE_TEST_DB_URL') != null)
    // Every test player keeps a full record of all ~1,470 advancements for the life of the shared test server (measured: 413 players,
    // about 508 MB still in use at the end); a Fabric server with its chunk system needs more room than that.
    maxHeapSize = '3G'
    // The game (Knot, config files, logs) runs from its own directory, not the project root (run/ is git-ignored); tests that read project files
    // resolve them from kegare.projectDir.
    workingDir = file('run/test')
    doFirst { workingDir.mkdirs() }
    systemProperty 'kegare.projectDir', project.projectDir.absolutePath
    // AgentFilesTest reads these; without them as inputs, a change to only them would leave the tests "up to date".
    inputs.files('CLAUDE.md', 'AGENTS.md', 'AGENT.md').withPropertyName('agentFiles').withPathSensitivity(PathSensitivity.RELATIVE)
}
