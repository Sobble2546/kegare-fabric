org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Which Minecraft build to compile: -Ptarget=1.21.11 (default), 26.2 or 26.3. Per-target values live in targets/<target>.properties.
target=1.21.11

mod_id=kegare
mod_name=Kegare
# The license of the mod, shown in the mod list: the code is MIT, the assets All Rights Reserved (README, License).
mod_license=MIT (code), All Rights Reserved (assets)
# The mod version. See https://semver.org/
mod_version=0.2.1-alpha
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.cnethuka.kegare
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
# The Minecraft versions the universal jar carries (task universalJar).
universal_targets=1.21.11,26.2,26.3
